name: Packages

# Builds the packages DevSpace publishes itself (programs without official
# relocatable builds), and attaches them to the GitHub release
# `<package>-<version>`. Run by the maintainer; the SHA-256 and sizes in the
# job summary then go into `registry/index.json`, which is signed locally.
# Existing assets are never replaced: their hashes may already be signed.

on:
  workflow_dispatch:
    inputs:
      valkey:
        description: "Valkey version (pinned in scripts/packages/valkey-sources.txt)"
        required: true

permissions:
  contents: read

jobs:
  valkey:
    name: valkey ${{ inputs.valkey }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            os: macos-latest
          - platform: macos-x86_64
            os: macos-15-intel
          # glibc 2.28, like the MySQL builds of the index.
          - platform: linux-x86_64
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: scripts/packages/build-valkey.sh "${{ inputs.valkey }}" "${{ matrix.platform }}" dist | tee build.log
      - name: Summary
        shell: bash
        run: echo "\`$(tail -n 1 build.log)\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: valkey-${{ inputs.valkey }}-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish valkey ${{ inputs.valkey }}
    needs: valkey
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: valkey-${{ inputs.valkey }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Valkey ${{ inputs.valkey }} (DevSpace build)" \
              --notes "Valkey ${{ inputs.valkey }} built by DevSpace from the official sources, without TLS. License: BSD-3-Clause (COPYING in each archive)." \
              --latest=false
          fi
          # No --clobber: an asset already published is never replaced.
          gh release upload "$TAG" dist/*.tar.gz
          {
            echo "| archive | size | sha256 |"
            echo "|---|---|---|"
            for f in dist/*.tar.gz; do
              echo "| $(basename "$f") | $(stat -c %s "$f") | $(sha256sum "$f" | cut -d' ' -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
