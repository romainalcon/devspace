[package]
name = "devspace-platform"
description = "Operating-system specific primitives for DevSpace (directories, privileges, local IPC transport, signals, processes)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
directories.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "signal", "time", "macros"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }

[lints]
workspace = true
