[package]
name = "devspace-daemon"
description = "DevSpace background daemon, single source of truth for projects, services and processes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "devspaced"
path = "src/main.rs"

[dependencies]
devspace-core.workspace = true
devspace-ipc.workspace = true
devspace-platform.workspace = true
clap.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "process",
] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "net"] }

[lints]
workspace = true
