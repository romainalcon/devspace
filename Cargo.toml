[workspace]
resolver = "3"

members = [
    "crates/core",
    "crates/daemon",
    "crates/cli",
    "crates/ipc",
    "crates/platform",
    "crates/helper",
    "tools/registry",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

# Shared dependency versions. Only dependencies actually used by at least one
# crate are declared here; new ones are added with the milestone needing them.
[workspace.dependencies]
# Internal crates
devspace-core = { path = "crates/core" }
devspace-ipc = { path = "crates/ipc" }
devspace-platform = { path = "crates/platform" }
devspace-helper = { path = "crates/helper" }

# Serialization and configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Errors
thiserror = "2"

# Async runtime (features are selected by each crate)
tokio = { version = "1.47", default-features = false }

# Logging
tracing = "0.1"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "fmt",
    "ansi",
    "env-filter",
    "registry",
] }

# CLI
clap = { version = "4", features = ["derive"] }

# Platform
directories = "6"
libc = "0.2"
windows-sys = "0.61"

# Storage
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }

# Filesystem
dunce = "1"

# Downloads, checksums and archives
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sha2 = "0.11"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
base64 = "0.23"

# Package index signatures (minisign format, Ed25519)
minisign-verify = "0.3"
minisign = { version = "0.10", default-features = false }

# Tests
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
